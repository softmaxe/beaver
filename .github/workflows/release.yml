name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.release_version.outputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read and validate release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version = "/ {
              value = $0
              sub(/^version = "/, "", value)
              sub(/"[[:space:]]*$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)"
          if [[ -z "$package_version" ]]; then
            echo "Could not read package.version from Cargo.toml" >&2
            exit 1
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tag must match vX.Y.Z: $tag" >&2
              exit 1
            fi
            tag_version="${tag#v}"
            if [[ "$tag_version" != "$package_version" ]]; then
              echo "Tag version $tag_version does not match Cargo.toml package.version $package_version" >&2
              exit 1
            fi
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_extension: tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive_extension: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive_extension: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive_extension: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive_extension: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.88.0 and target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup target add --toolchain 1.88.0 "${{ matrix.target }}"
          rustup show active-toolchain

      - name: Run tests
        shell: bash
        run: cargo +1.88.0 test --locked

      - name: Build release binary
        shell: bash
        run: cargo +1.88.0 build --release --locked --target "${{ matrix.target }}"

      - name: Set package metadata
        id: package_metadata
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          set -euo pipefail
          package_name="beaver-v${PACKAGE_VERSION}-${{ matrix.target }}"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package_metadata.outputs.package_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          staging_root="$RUNNER_TEMP/beaver-package"
          package_dir="$staging_root/$PACKAGE_NAME"
          archive_path="$GITHUB_WORKSPACE/dist/$PACKAGE_NAME.tar.gz"
          rm -rf "$staging_root"
          mkdir -p "$package_dir" "${archive_path%/*}"
          cp "target/$TARGET/release/beaver" "$package_dir/beaver"
          cp README.md README.zh-CN.md LICENSE "$package_dir/"
          tar -C "$staging_root" -czf "$archive_path" "$PACKAGE_NAME"

          for file in beaver README.md README.zh-CN.md LICENSE; do
            tar -tzf "$archive_path" | grep -Fx "$PACKAGE_NAME/$file" >/dev/null
          done

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ steps.package_metadata.outputs.package_name }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stagingRoot = Join-Path $env:RUNNER_TEMP 'beaver-package'
          $packageDir = Join-Path $stagingRoot $env:PACKAGE_NAME
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $archivePath = Join-Path $distDir ($env:PACKAGE_NAME + '.zip')
          if (Test-Path $stagingRoot) {
            Remove-Item -Recurse -Force $stagingRoot
          }
          New-Item -ItemType Directory -Force -Path $packageDir, $distDir | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE ("target\{0}\release\beaver.exe" -f $env:TARGET)) (Join-Path $packageDir 'beaver.exe')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'README.md'), (Join-Path $env:GITHUB_WORKSPACE 'README.zh-CN.md'), (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') $packageDir
          Compress-Archive -Path $packageDir -DestinationPath $archivePath -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $expected = @(
              "$($env:PACKAGE_NAME)/beaver.exe",
              "$($env:PACKAGE_NAME)/README.md",
              "$($env:PACKAGE_NAME)/README.zh-CN.md",
              "$($env:PACKAGE_NAME)/LICENSE"
            )
            foreach ($file in $expected) {
              if (-not ($zip.Entries.FullName -contains $file)) {
                throw "Archive is missing $file"
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package_metadata.outputs.package_name }}
          path: dist/${{ steps.package_metadata.outputs.package_name }}.${{ matrix.archive_extension }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: beaver-v*-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(beaver-v*.tar.gz beaver-v*.zip)
          if [[ "${#archives[@]}" -eq 0 ]]; then
            echo "No release archives found" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" | sort -k2 > SHA256SUMS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "WARNING: These release binaries are unsigned. macOS Gatekeeper and Windows SmartScreen may warn when you open them." \
            dist/*

  bump-tap:
    name: Update Homebrew tap
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Update tap formula
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_GITHUB_TOKEN:-}" ]]; then
            echo "TAP_GITHUB_TOKEN is not set, skip tap update." >&2
            echo "Create a PAT with repo scope and add it as TAP_GITHUB_TOKEN in softmaxe/beaver settings." >&2
            exit 0
          fi

          version="${TAG#v}"
          echo "Bump tap to $version ($TAG)"

          tmp_tap="$(mktemp -d)"
          tmp_dist="$(mktemp -d)"
          trap 'rm -rf "$tmp_tap" "$tmp_dist"' EXIT

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/softmaxe/homebrew-tap.git" "$tmp_tap"

          gh release download "$TAG" --repo softmaxe/beaver --pattern "SHA256SUMS" --dir "$tmp_dist"
          cat "$tmp_dist/SHA256SUMS"

          get_sha() {
            local name="$1"
            awk -v n="$name" '$2 == n { print $1 }' "$tmp_dist/SHA256SUMS"
          }

          sha_macos_arm="$(get_sha "beaver-v${version}-aarch64-apple-darwin.tar.gz")"
          sha_linux_arm="$(get_sha "beaver-v${version}-aarch64-unknown-linux-gnu.tar.gz")"
          sha_linux_intel="$(get_sha "beaver-v${version}-x86_64-unknown-linux-gnu.tar.gz")"

          for v in sha_macos_arm sha_linux_arm sha_linux_intel; do
            if [[ -z "${!v:-}" ]]; then
              echo "Missing SHA for $v" >&2
              exit 1
            fi
          done

          formula="$tmp_tap/Formula/beaver.rb"

          # Update URLs (version is inferred from URL, no explicit version field)
          if grep -q 'version "' "$formula"; then
            sed -i.bak -E "s/version \"[^\"]+\"/version \"${version}\"/" "$formula"
          fi
          sed -i.bak -E "s|beaver/releases/download/v[^/]+/beaver-v[^/]+-aarch64-apple-darwin.tar.gz|beaver/releases/download/v${version}/beaver-v${version}-aarch64-apple-darwin.tar.gz|" "$formula"
          sed -i.bak -E "s|beaver/releases/download/v[^/]+/beaver-v[^/]+-aarch64-unknown-linux-gnu.tar.gz|beaver/releases/download/v${version}/beaver-v${version}-aarch64-unknown-linux-gnu.tar.gz|" "$formula"
          sed -i.bak -E "s|beaver/releases/download/v[^/]+/beaver-v[^/]+-x86_64-unknown-linux-gnu.tar.gz|beaver/releases/download/v${version}/beaver-v${version}-x86_64-unknown-linux-gnu.tar.gz|" "$formula"
          rm -f "$formula.bak"

          # Update SHA256 blocks by pairing url and sha256 lines
          python3 - "$formula" "$sha_macos_arm" "$sha_linux_arm" "$sha_linux_intel" <<'PY'
          import pathlib, sys, re
          path = pathlib.Path(sys.argv[1])
          sha_macos_arm, sha_linux_arm, sha_linux_intel = sys.argv[2:5]
          text = path.read_text()
          if "depends_on arch: :arm64" not in text:
              text = text.replace("  on_macos do\n", "  on_macos do\n    depends_on arch: :arm64\n", 1)
          text = re.sub(
              r'\n    on_intel do\n      url ".*x86_64-apple-darwin\.tar\.gz"\n      sha256 "[^"]+"\n    end',
              "",
              text,
          )
          mapping = {
              "aarch64-apple-darwin.tar.gz": sha_macos_arm,
              "aarch64-unknown-linux-gnu.tar.gz": sha_linux_arm,
              "x86_64-unknown-linux-gnu.tar.gz": sha_linux_intel,
          }
          for archive, sha in mapping.items():
              pattern = re.compile(r'(url ".*' + re.escape(archive) + r'"\n\s*sha256 ")[^"]+(")')
              text, n = pattern.subn(r'\g<1>' + sha + r'\2', text)
              if n == 0:
                  print(f"no match for {archive}", file=sys.stderr)
                  sys.exit(1)
          path.write_text(text)
          print(path.read_text())
          PY

          echo "--- updated formula ---"
          cat "$formula"

          git -C "$tmp_tap" config user.name "github-actions[bot]"
          git -C "$tmp_tap" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$tmp_tap" add Formula/beaver.rb
          if git -C "$tmp_tap" diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git -C "$tmp_tap" commit -m "chore: bump beaver to ${version}"

          for attempt in 1 2 3; do
            if git -C "$tmp_tap" push origin main; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Failed to push tap after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 2))
            git -C "$tmp_tap" fetch origin main
            git -C "$tmp_tap" rebase origin/main
          done
