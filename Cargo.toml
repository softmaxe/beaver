[package]
name = "beaver"
version = "1.0.4"
edition = "2021"
rust-version = "1.88"
description = "Rename subtitle files to match their videos, from a terminal UI or a CLI."
license = "AGPL-3.0-only"
readme = "README.md"

[lib]
name = "beaver"
path = "src/lib.rs"

[[bin]]
name = "beaver"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30.2"
unicode-normalization = "0.1.25"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
