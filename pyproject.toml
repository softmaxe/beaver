[project]
name = "rename-subtitles"
version = "0.1.0"
description = "Rename subtitle files to match their videos, from a terminal UI or a CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = ["textual>=8.2,<9"]

[project.scripts]
rename-subs = "rename_subtitles.cli:main"
rename-subs-tui = "rename_subtitles.tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rename_subtitles"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "ruff>=0.16.1",
]
